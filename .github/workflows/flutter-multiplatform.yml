name: Crown Studio | Cross-platform builds

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'scripts/prepare_android_play.py'
      - '.github/workflows/flutter-multiplatform.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-android:
    name: Android APK / AAB
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform and install packages
        run: |
          flutter create --platforms=android --org com.arosoft --project-name crown_password_studio .
          flutter pub get
          python3 scripts/prepare_android_play.py
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos lib test
          flutter test
      - name: Build Android APK
        run: |
          flutter build apk --debug
          flutter build appbundle --release
      - name: Inspect Android Play target
        run: |
          test -s build/app/outputs/bundle/release/app-release.aab
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q 'applicationId = "com.arosoft.crownpasswordstudio"' android/app/build.gradle.kts
          echo "AAB from default Flutter debug key is for technical testing only; it is NOT a production-signed Play bundle."
      - name: Upload Android test APK
        uses: actions/upload-artifact@v4
        with:
          name: crown-android-test-apk-and-aab-NOT-FOR-PLAY
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows desktop
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows application
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --org com.arosoft --project-name crown_password_studio .
          flutter pub get
          flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: crown-windows-unsigned
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS desktop
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate macOS application
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos --org com.arosoft --project-name crown_password_studio .
          flutter pub get
          flutter build macos --release
      - uses: actions/upload-artifact@v4
        with:
          name: crown-macos-unsigned
          path: build/macos/Build/Products/Release/*.app/**
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS simulator (unsigned)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS application and compile without Apple signing
        run: |
          flutter create --platforms=ios --org com.arosoft --project-name crown_password_studio .
          flutter pub get
          flutter build ios --simulator --debug --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: crown-ios-simulator-unsigned
          path: build/ios/iphonesimulator/Runner.app/**
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux desktop
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Linux application
        run: |
          flutter config --enable-linux-desktop
          flutter create --platforms=linux --org com.arosoft --project-name crown_password_studio .
          flutter pub get
          flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: crown-linux-unsigned
          path: build/linux/x64/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate web platform and prepare PDF engine
        run: |
          flutter create --platforms=web --org com.arosoft --project-name crown_password_studio .
          flutter pub get
          dart run pdf_manipulator:setup
          flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: crown-web
          path: build/web/**
          if-no-files-found: error
          retention-days: 14
