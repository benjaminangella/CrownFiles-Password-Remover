name: Crown Studio | Signed Android release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-signed-release.yml'
  workflow_dispatch:
    inputs:
      build_label:
        description: Optional release label
        type: string
        required: false

permissions:
  contents: read

jobs:
  signed-android:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check signing credentials
        env:
          KEYSTORE: ${{ secrets.CROWN_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.CROWN_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CROWN_ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CROWN_ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || {
            echo "Missing Android release-signing secrets. Configure GitHub Environment: production."
            exit 1
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android application
        run: |
          flutter create --platforms=android --org com.arosoft --project-name crown_password_studio .
          flutter pub get
          python3 scripts/prepare_android_play.py
      - name: Install private release keystore
        env:
          KEYSTORE: ${{ secrets.CROWN_ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p android
          printf '%s' "$KEYSTORE" | base64 --decode > android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks
      - name: Configure release signing
        run: python3 scripts/configure_android_signing.py
      - name: Build release APK and Play Store AAB
        env:
          CROWN_KEYSTORE_FILE: ../upload-keystore.jks
          CROWN_STORE_PASSWORD: ${{ secrets.CROWN_ANDROID_STORE_PASSWORD }}
          CROWN_KEY_PASSWORD: ${{ secrets.CROWN_ANDROID_KEY_PASSWORD }}
          CROWN_KEY_ALIAS: ${{ secrets.CROWN_ANDROID_KEY_ALIAS }}
        run: |
          flutter analyze --no-fatal-infos lib test
          flutter test
          flutter build apk --release
          flutter build appbundle --release
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
          grep -q 'applicationId = "com.arosoft.crownpasswordstudio"' android/app/build.gradle.kts
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -E 'Owner:|SHA256:' | head -4
      - name: Upload signed distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrownPasswordStudio-0.3.0-Android-SIGNED-APK-and-Play-AAB
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
      - name: Delete private signing key from runner
        if: always()
        run: rm -f android/upload-keystore.jks
